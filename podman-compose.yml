version: '3.8'

services:
  # LocalStack for AWS Services Emulation (KMS, etc.)
  localstack:
    image: localstack/localstack:0.11.2
    container_name: pii-vault-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: kms
      DEBUG: "false"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - localstack_data:/tmp/localstack
    networks:
      - pii-vault-network

  # PostgreSQL database for PII Vault
  postgres:
    image: docker.io/library/postgres:18.1-alpine
    container_name: pii-vault-postgres
    environment:
      POSTGRES_DB: pii_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pii-vault-network

  # PII Vault application
  pii-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-vault-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pii_vault
      SPRING_DATASOURCE_USERNAME: vault_user
      SPRING_DATASOURCE_PASSWORD: vault_password_dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_OVERRIDE_KMS: http://localstack:4566
    ports:
      - "8080:8080"
    depends_on:
      - localstack
      - postgres
    networks:
      - pii-vault-network
    restart: on-failure

  # VictoriaMetrics for time-series metrics collection
  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: pii-vault-victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/storage
    command:
      - "--storageDataPath=/storage"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
    networks:
      - pii-vault-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pii-vault-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - pii-vault-network

volumes:
  postgres_data:
    driver: local
  localstack_data:
    driver: local
  victoriametrics_data:
    driver: local
  grafana_data:
    driver: local

networks:
  pii-vault-network:
    driver: bridge
