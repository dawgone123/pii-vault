version: '3.8'

services:
  # PostgreSQL database for PII Vault
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: pii-vault-postgres
    environment:
      POSTGRES_DB: pii_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d pii_vault"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pii-vault-network

  # PII Vault application
  pii-vault:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pii-vault-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pii_vault
      SPRING_DATASOURCE_USERNAME: vault_user
      SPRING_DATASOURCE_PASSWORD: vault_password_dev
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_PII: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pii-vault-network
    restart: on-failure

  # Optional: H2 Console for development (if using H2)
  h2-console:
    image: docker.io/library/alpine:latest
    container_name: pii-vault-h2-console
    ports:
      - "8081:8081"
    environment:
      H2_WEB_CONSOLE_PORT: "8081"
    networks:
      - pii-vault-network
    command: echo "H2 Console ready on http://localhost:8081/h2-console"

volumes:
  postgres_data:
    driver: local

networks:
  pii-vault-network:
    driver: bridge
