spring:
  application:
    name: pii-vault
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://localhost:5432/pii_vault
    username: vault_user
    password: vault_password_dev
    driverClassName: org.postgresql.Driver

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.pii: DEBUG

# Actuator Configuration for Metrics Exposure
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        pii.vault.encryption.latency: true
      slo:
        http.server.requests: 10ms,50ms,100ms,500ms,1s
        pii.vault.encryption.latency: 10ms,50ms,100ms
    tags:
      application: pii-vault
      environment: development

# VictoriaMetrics Configuration (for local development)
victoriaMetrics:
  url: http://victoriametrics:8428/api/v1/write
  pushInterval: 15s
  enabled: true
